[project]
name = "haiku-rag-macos"
version = "0.1.0"
description = "The macOS desktop parts around haiku.rag: the search reader, the folder register and the ingester's idle exit"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    # haiku.rag itself, from PyPI: the library, its CLI and haiku-ingester.
    "haiku.rag-slim[docling,ingester]==0.107.0",
    # RapidOCR's runtime: without it RapidOCR falls back to torch, at about
    # half the speed (ggozad/haiku.rag#828).
    "onnxruntime>=1.22.0,<2.0.0",
    # Apple Vision OCR, processing.conversion_options.ocr_engine: ocrmac.
    "ocrmac>=1.0.1,<2.0.0; sys_platform == 'darwin'",
]

[project.scripts]
haiku-rag-macos = "haiku_rag_macos.cli:main"

[project.entry-points."haiku.rag.hooks"]
macos-folders = "haiku_rag_macos.hook:FolderRetirement"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haiku_rag_macos"]

[tool.uv]
# haiku.rag's release was tested with exactly these: every package of its
# uv.lock at that commit (0.107.0, 33c8a4f21d5e922f020dada17a7f719743347aad).
# scripts/pin-haiku-rag.py rewrites the list for another release.
