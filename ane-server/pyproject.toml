[project]
name = "haiku-rag-ane-server"
version = "0.1.0"
description = "OpenAI-compatible embedding server running a Core ML model on the Apple Neural Engine"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pyobjc-framework-CoreML>=13.0,<14.0",
    "tokenizers>=0.22.0,<1.0.0",
]

[project.scripts]
haiku-rag-ane-server = "haiku_rag_ane:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["haiku_rag_ane.py"]
